[package]
name = "sui-indexer-store"
description = "SQLite schema, writes and reads shared by the sui-indexer ingester and API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# SQLite compiled in (bundled): the same engine everywhere, no system library, no ORM.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
getrandom = "=0.4.3"

[dev-dependencies]
tempfile = "=3.27.0"
