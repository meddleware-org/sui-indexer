[package]
name = "sui-indexer-ingest"
description = "sui-indexer ingester: the sole writer; polls the full node's ListEvents into PostgreSQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ingest"
path = "src/main.rs"

[features]
# The one-off SQLite importer (`ingest import-sqlite`): in the 0.0.14 image only; 0.0.15 removes it.
import-sqlite = ["sui-indexer-store/import-sqlite", "sui-indexer-testkit/import-sqlite"]

[dependencies]
sui-indexer-store = { path = "../store" }
# Mysten's official Rust SDK (sui-rust-sdk): native gRPC client for LedgerService.ListEvents /
# GetServiceInfo. Pinned exactly: 0.x releases change the generated API.
sui-rpc = { version = "=0.4.0", default-features = false }
tonic = { version = "=0.14.6", default-features = false }
prost-types = "=0.14.4"
tokio = { version = "=1.53.3", features = ["rt", "macros", "time", "signal"] }
base64 = "=0.23.1"
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }
serde_json = "=1.0.154"

[dev-dependencies]
sui-indexer-store = { path = "../store", features = ["testing"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["rt", "macros", "time", "net", "test-util"] }
# A local LedgerService stub for the gRPC source tests (generated server of sui-rpc).
tonic = { version = "=0.14.6", default-features = false, features = ["server", "router", "transport", "codegen"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
sui-indexer-testkit = { path = "../testkit" }
