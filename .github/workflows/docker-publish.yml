name: Publish (Docker)
# Release pipeline for sui-indexer. Fires on version tags (v*).
#
# Supply-chain controls (verifiable by any anonymous operator):
#   - Multi-arch build (linux/amd64, linux/arm64) via Buildx/QEMU
#   - SBOMs attested with cosign: the image (SPDX, syft) and each binary's crates (CycloneDX,
#     cargo-cyclonedx, checked against Cargo.lock by scripts/check-sbom.sh); SLSA provenance by BuildKit
#   - Keyless cosign signatures (Sigstore Fulcio/Rekor) over the image digest
#   - GitHub-native build-provenance attestation
#   - `latest` is published ONLY for stable (non-pre-release) semver tags
#
# Public registries (quay.io, Docker Hub) get the full treatment. The self-hosted
# registry receives the SAME published image by digest (cosign copy, never a rebuild; the
# `mirror-private` job is best-effort, continue-on-error, since it may not be configured yet).
#
# Required repository configuration:
#   Secrets: QUAY_USERNAME/QUAY_TOKEN, DOCKERHUB_USERNAME/DOCKERHUB_TOKEN,
#            PRIVATE_REGISTRY_USERNAME/PRIVATE_REGISTRY_TOKEN
#   Vars (optional overrides): QUAY_NAMESPACE, DOCKERHUB_NAMESPACE,
#            PRIVATE_REGISTRY, PRIVATE_NAMESPACE, VENDOR, DESCRIPTION,
#            SOURCE_URL, DOCUMENTATION_URL, IMAGE_URL

on:
  push:
    tags:
      - "v*"

env:
  IMAGE: sui-indexer

permissions:
  contents: read

jobs:
  version:
    name: Tag matches the Cargo workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "sui-indexer-api") | .version')"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag ${TAG} does not match the Cargo workspace version ${VERSION}"
            exit 1
          fi

  # The release runs exactly what CI runs (fmt, clippy, tests, cargo-deny, the SBOM gate, MSRV, the client
  # contract, licence notices, configuration and image scans, the two-binary smoke test) on the tagged
  # commit, so no check can be skipped by tagging.
  verify:
    name: Verify (CI checks)
    uses: ./.github/workflows/rust-ci.yml

  publish-public:
    name: Publish (quay.io + Docker Hub)
    runs-on: ubuntu-latest
    needs: [version, verify]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push (multi-arch, SBOM + provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit SBOM pulls docker/buildkit-syft-scanner from Docker Hub, whose
          # anonymous OAuth endpoint is unreliable (connection resets). Provenance
          # + cosign signatures + actions/attest-build-provenance already cover
          # supply-chain attestation, matching the split-arch image repos.
          sbom: false
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VENDOR=${{ vars.VENDOR || 'Meddleware' }}
            DESCRIPTION=${{ vars.DESCRIPTION || 'Lean read-indexer for the Meddleware Sui packages (access_gate, sealed_content).' }}
            SOURCE_URL=${{ vars.SOURCE_URL || 'https://github.com/meddleware-org/sui-indexer' }}
            DOCUMENTATION_URL=${{ vars.DOCUMENTATION_URL || 'https://github.com/meddleware-org/sui-indexer#readme' }}
            IMAGE_URL=${{ vars.IMAGE_URL || 'https://quay.io/meddleware-org/sui-indexer' }}

      - name: Scan the published image (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
        run: |
          cosign sign --yes "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          cosign sign --yes "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"

      # Three SBOMs are attested to the image digest:
      #   1. the published image (SPDX, syft): the distroless base, plus the crates syft reads from the
      #      /app/Cargo.lock it ships;
      #   2. and 3. the crates linked into /app/api and /app/ingest (CycloneDX, cargo-cyclonedx, build and
      #      dev dependencies excluded), each checked against the Cargo.lock dependency graph by
      #      scripts/check-sbom.sh, so a missing crate stops the release.
      # `cosign verify-attestation --type spdxjson` returns the first, `--type cyclonedx` the other two.
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-cyclonedx@0.5.9

      # The ingester is described with the feature set the image is built with (the Dockerfile's CARGO_FEATURES: the
      # temporary SQLite importer, in 0.0.14 only); the API is built without it. Remove the feature lines in 0.0.15.
      - name: Generate the SBOMs of the two binaries
        run: |
          cargo cyclonedx --manifest-path crates/api/Cargo.toml --format json --spec-version 1.5 \
            --no-build-deps --target x86_64-unknown-linux-gnu -q
          cp crates/api/sui-indexer-api.cdx.json sbom.api.cdx.json
          bash scripts/check-sbom.sh sbom.api.cdx.json sui-indexer-api
          cargo cyclonedx --manifest-path crates/ingest/Cargo.toml --format json --spec-version 1.5 \
            --no-build-deps --target x86_64-unknown-linux-gnu --features import-sqlite -q
          cp crates/ingest/sui-indexer-ingest.cdx.json sbom.ingest.cdx.json
          CARGO_FEATURES=sui-indexer-ingest/import-sqlite bash scripts/check-sbom.sh sbom.ingest.cdx.json sui-indexer-ingest

      - name: Attest SBOMs (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}
        run: |
          for ref in "quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}" "docker.io/${DOCKERHUB_NS}/${IMAGE}@${DIGEST}"; do
            cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$ref"
            for bin in api ingest; do
              cosign attest --yes --type cyclonedx --predicate "sbom.${bin}.cdx.json" "$ref"
            done
          done

      - name: Attest build provenance (quay.io)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: quay.io/${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'meddleware' }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "Published & signed @ digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify: cosign verify --certificate-identity-regexp '^https://github.com/meddleware-org/sui-indexer/\\.github/workflows/docker-publish\\.yml@refs/tags/v' --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>" >> "$GITHUB_STEP_SUMMARY"

  # ── Self-hosted registry: promote the published image by digest (no rebuild) ──
  # quay.io, Docker Hub and the self-hosted registry must return the SAME digest for
  # <image>:<tag> (workspace docs/images/IMAGES.md, "Consensus"), so this job copies the image
  # that publish-public pushed and signed instead of building it again. Best-effort: it fails
  # harmlessly until the PRIVATE_REGISTRY_* credentials exist.
  mirror-private:
    name: Mirror (self-hosted registry)
    runs-on: ubuntu-latest
    needs: [publish-public]
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4

      - name: Log in to self-hosted registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}/${{ vars.PRIVATE_NAMESPACE || 'meddleware-org' }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Copy the published image (same digest) and verify
        env:
          DIGEST: ${{ needs.publish-public.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          QUAY_NS: ${{ vars.QUAY_NAMESPACE || 'meddleware-org' }}
          PRIVATE_REGISTRY: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}
          PRIVATE_NAMESPACE: ${{ vars.PRIVATE_NAMESPACE || 'meddleware-org' }}
        run: |
          set -euo pipefail
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the public job exported no valid image digest (got '${DIGEST}')"
            exit 1
          fi
          SRC="quay.io/${QUAY_NS}/${IMAGE}@${DIGEST}"
          COUNT=0
          while IFS= read -r dest; do
            [[ -n "${dest}" ]] || continue
            COUNT=$((COUNT + 1))
            # The published manifest is copied byte-for-byte, so the digest is unchanged;
            # `cosign copy` also carries the tag-based cosign artifacts (.sig/.att/.sbom).
            cosign copy --force "${SRC}" "${dest}"
            # cosign v3 stores signatures, SBOM attestations and build provenance as OCI
            # referrers, which `cosign copy` does not transfer: copy the referrers too.
            oras cp --recursive "${SRC}" "${dest}"
            GOT="$(docker buildx imagetools inspect "${dest}" --format '{{.Manifest.Digest}}')"
            if [[ "${GOT}" != "${DIGEST}" ]]; then
              echo "::error::${dest} resolves to ${GOT}, not the published ${DIGEST}"
              exit 1
            fi
            echo "${dest} -> ${GOT}"
          done <<< "${TAGS}"
          if (( COUNT == 0 )); then
            echo "::error::no tags to mirror (not a release tag?)"
            exit 1
          fi
          # The signature must verify on the mirror exactly as it does on quay.io.
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/docker-publish\.yml@refs/tags/v" \
            "${PRIVATE_REGISTRY}/${PRIVATE_NAMESPACE}/${IMAGE}@${DIGEST}" > /dev/null

      - name: Summary
        if: always()
        env:
          DIGEST: ${{ needs.publish-public.outputs.digest }}
          PRIVATE_REGISTRY: ${{ vars.PRIVATE_REGISTRY || 'registry.meddleware.co.uk' }}
        run: |
          echo "Mirrored (no rebuild) @ digest ${DIGEST} to private registry @ ${PRIVATE_REGISTRY}" >> "$GITHUB_STEP_SUMMARY"
